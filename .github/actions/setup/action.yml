name: Setup
description: Install pnpm, Node.js and the workspace dependencies

inputs:
  node-version:
    description: Node.js version
    default: "22"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}

    - run: pnpm install --frozen-lockfile
      shell: bash
