name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
      deploy:
        default: true
        description: Upload installers to the download server
        required: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            runner: macos-15-intel
            args: --mac --x64
          - name: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - name: windows-x64
            runner: windows-latest
            args: --win --x64
          - name: linux-x64
            runner: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BLAME_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "BLAME_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - run: pnpm --filter @blame/desktop build

      - name: Package installers
        run: pnpm --filter @blame/desktop package -- ${{ matrix.args }} --publish never
        env:
          BLAME_DOWNLOAD_BASE_URL: ${{ secrets.BLAME_DOWNLOAD_BASE_URL }}
          BLAME_HOMEPAGE: ${{ vars.BLAME_HOMEPAGE }}
          BLAME_MAINTAINER_EMAIL: ${{ vars.BLAME_MAINTAINER_EMAIL }}
          BLAME_MAINTAINER_NAME: ${{ vars.BLAME_MAINTAINER_NAME }}
          BLAME_RUNTIME_VERSION: ${{ vars.BLAME_RUNTIME_VERSION }}
          BLAME_REQUIRE_PREBUILT_RUNTIME: true
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: blame-desktop-${{ matrix.name }}
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.zip
          if-no-files-found: error

  deploy:
    name: Deploy installers
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files
          pattern: blame-desktop-*

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BLAME_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "BLAME_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.BLAME_DOWNLOAD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.BLAME_DOWNLOAD_SSH_PORT || 22 }}" "${{ secrets.BLAME_DOWNLOAD_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload to VPS
        shell: bash
        env:
          DOWNLOAD_HOST: ${{ secrets.BLAME_DOWNLOAD_HOST }}
          DOWNLOAD_PATH: ${{ secrets.BLAME_DOWNLOAD_PATH }}
          DOWNLOAD_PORT: ${{ secrets.BLAME_DOWNLOAD_SSH_PORT || 22 }}
          DOWNLOAD_USER: ${{ secrets.BLAME_DOWNLOAD_USER }}
        run: |
          ssh -p "$DOWNLOAD_PORT" "$DOWNLOAD_USER@$DOWNLOAD_HOST" "mkdir -p '$DOWNLOAD_PATH/releases/$BLAME_VERSION' '$DOWNLOAD_PATH/latest'"
          rsync -az --delete -e "ssh -p $DOWNLOAD_PORT" release-files/ "$DOWNLOAD_USER@$DOWNLOAD_HOST:$DOWNLOAD_PATH/releases/$BLAME_VERSION/"
          rsync -az --delete -e "ssh -p $DOWNLOAD_PORT" release-files/ "$DOWNLOAD_USER@$DOWNLOAD_HOST:$DOWNLOAD_PATH/latest/"
