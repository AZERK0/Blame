name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
      runtime_version:
        description: Published runtime version (defaults to repository configuration)
        required: false
        type: string
      deploy:
        default: true
        description: Upload installers to the download server
        required: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  preflight:
    name: Verify published runtime
    runs-on: ubuntu-latest
    outputs:
      runtime_version: ${{ steps.runtime.outputs.runtime_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/macos-signing.test.mjs
      - run: pnpm --filter @blame/desktop test:package
      - id: runtime
        run: node scripts/release-preflight.mjs
        env:
          BLAME_DOWNLOAD_BASE_URL: ${{ secrets.BLAME_DOWNLOAD_BASE_URL }}
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version || vars.BLAME_RUNTIME_VERSION }}

  build:
    needs: preflight
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            runner: macos-15-intel
            args: --mac --x64
          - name: macos-arm64
            runner: macos-latest
            args: --mac --arm64
          - name: windows-x64
            runner: windows-latest
            args: --win --x64
          - name: linux-x64
            runner: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - run: pnpm install --frozen-lockfile

      - name: Test package integrity on target OS
        run: pnpm --filter @blame/desktop test:package

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BLAME_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "BLAME_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - run: pnpm --filter @blame/desktop build

      - name: Package macOS installers
        if: runner.os == 'macOS'
        run: pnpm --filter @blame/desktop package -- ${{ matrix.args }} --publish never
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          BLAME_DOWNLOAD_BASE_URL: ${{ secrets.BLAME_DOWNLOAD_BASE_URL }}
          BLAME_HOMEPAGE: ${{ vars.BLAME_HOMEPAGE }}
          BLAME_MAINTAINER_EMAIL: ${{ vars.BLAME_MAINTAINER_EMAIL }}
          BLAME_MAINTAINER_NAME: ${{ vars.BLAME_MAINTAINER_NAME }}
          BLAME_RUNTIME_VERSION: ${{ needs.preflight.outputs.runtime_version }}
          BLAME_REQUIRE_PREBUILT_RUNTIME: true
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}

      - name: Package Windows and Linux installers
        if: runner.os != 'macOS'
        run: pnpm --filter @blame/desktop package -- ${{ matrix.args }} --publish never
        env:
          BLAME_DOWNLOAD_BASE_URL: ${{ secrets.BLAME_DOWNLOAD_BASE_URL }}
          BLAME_HOMEPAGE: ${{ vars.BLAME_HOMEPAGE }}
          BLAME_MAINTAINER_EMAIL: ${{ vars.BLAME_MAINTAINER_EMAIL }}
          BLAME_MAINTAINER_NAME: ${{ vars.BLAME_MAINTAINER_NAME }}
          BLAME_RUNTIME_VERSION: ${{ needs.preflight.outputs.runtime_version }}
          BLAME_REQUIRE_PREBUILT_RUNTIME: true

      - name: Stage installers in S3
        if: github.event_name == 'push' || inputs.deploy
        env:
          BLAME_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.BLAME_DOWNLOAD_S3_ACCESS_KEY_ID }}
          BLAME_DOWNLOAD_S3_BUCKET: ${{ vars.BLAME_DOWNLOAD_S3_BUCKET }}
          BLAME_DOWNLOAD_S3_ENDPOINT: ${{ vars.BLAME_DOWNLOAD_S3_ENDPOINT }}
          BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ vars.BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          BLAME_DOWNLOAD_S3_REGION: ${{ vars.BLAME_DOWNLOAD_S3_REGION }}
          BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          BLAME_DOWNLOAD_STORAGE_DRIVER: s3
        run: node scripts/desktop-release.mjs stage --source packages/desktop/dist --prefix "_staging/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.name }}"

  deploy:
    name: Publish installers to S3
    needs: build
    if: always() && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Promote staged installers
        if: needs.build.result == 'success'
        env:
          BLAME_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.BLAME_DOWNLOAD_S3_ACCESS_KEY_ID }}
          BLAME_DOWNLOAD_S3_BUCKET: ${{ vars.BLAME_DOWNLOAD_S3_BUCKET }}
          BLAME_DOWNLOAD_S3_ENDPOINT: ${{ vars.BLAME_DOWNLOAD_S3_ENDPOINT }}
          BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ vars.BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          BLAME_DOWNLOAD_S3_REGION: ${{ vars.BLAME_DOWNLOAD_S3_REGION }}
          BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          BLAME_DOWNLOAD_STORAGE_DRIVER: s3
        run: node scripts/desktop-release.mjs deploy-staged --prefix "_staging/${{ github.run_id }}/${{ github.run_attempt }}" --prune-latest

      - name: Remove staged installers
        if: always()
        env:
          BLAME_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.BLAME_DOWNLOAD_S3_ACCESS_KEY_ID }}
          BLAME_DOWNLOAD_S3_BUCKET: ${{ vars.BLAME_DOWNLOAD_S3_BUCKET }}
          BLAME_DOWNLOAD_S3_ENDPOINT: ${{ vars.BLAME_DOWNLOAD_S3_ENDPOINT }}
          BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ vars.BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          BLAME_DOWNLOAD_S3_REGION: ${{ vars.BLAME_DOWNLOAD_S3_REGION }}
          BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          BLAME_DOWNLOAD_STORAGE_DRIVER: s3
        run: node scripts/desktop-release.mjs cleanup-staged --prefix "_staging/${{ github.run_id }}/${{ github.run_attempt }}"
