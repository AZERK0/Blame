name: Artifact cleanup

on:
  workflow_call:
    inputs:
      artifact_run_id:
        description: Workflow run whose transferred artifacts can be deleted
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete disposable artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: actions/github-script@v9
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const runId = Number(process.env.ARTIFACT_RUN_ID)
            const artifacts = runId
              ? (await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: runId,
                  per_page: 100,
                })).data.artifacts.filter(({ name }) => name.startsWith('blame-runtime-'))
              : await expiredArtifacts(github, owner, repo)

            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              })
            }

            core.info(`Deleted ${artifacts.length} artifact(s)`)

            async function expiredArtifacts(client, repositoryOwner, repositoryName) {
              const artifacts = []
              for await (const response of client.paginate.iterator(
                client.rest.actions.listArtifactsForRepo,
                { owner: repositoryOwner, repo: repositoryName, per_page: 100 },
              )) {
                artifacts.push(...response.data.filter(({ expired }) => expired))
              }
              return artifacts
            }
