name: Runtime release

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime version
        required: true
        type: string
      deploy:
        default: true
        description: Upload runtime artifacts
        required: true
        type: boolean
      staging_source:
        default: ""
        description: Existing S3 staging source (run_id/1; preserved across retries)
        required: false
        type: string
      artifact_run_id:
        default: ""
        description: Existing workflow run containing runtime artifacts
        required: false
        type: string

env:
  BLAME_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.BLAME_DOWNLOAD_S3_ACCESS_KEY_ID }}
  BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
  BLAME_DOWNLOAD_S3_BUCKET: ${{ vars.BLAME_DOWNLOAD_S3_BUCKET }}
  BLAME_DOWNLOAD_S3_ENDPOINT: ${{ vars.BLAME_DOWNLOAD_S3_ENDPOINT }}
  BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ vars.BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE }}
  BLAME_DOWNLOAD_S3_REGION: ${{ vars.BLAME_DOWNLOAD_S3_REGION }}
  BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}

permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    name: Build Windows runtime ${{ matrix.name }}
    if: inputs.artifact_run_id == '' && inputs.staging_source == ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-latest
            windows_arch: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            windows_arch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @blame/agent-runtime build
      - run: pnpm test:semantic-harness-payload
      - run: node --test scripts/semantic-harness-install.test.mjs

      - name: Build WSL rootfs
        run: pnpm build:runtime:windows -- --arch ${{ matrix.windows_arch }}
        env:
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}

      - name: Stage Windows runtime in S3
        run: node scripts/runtime-artifact-transfer.mjs stage "$STAGING_SOURCE" windows "${{ matrix.windows_arch }}"
        env:
          STAGING_SOURCE: ${{ github.run_id }}/1

  build-macos:
    name: Build macOS runtime ${{ matrix.name }}
    if: inputs.artifact_run_id == '' && inputs.staging_source == ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            firmware_package: ovmf
            qemu_package: qemu-system-x86
            macos_arch: x86_64
            runner: ubuntu-latest
          - name: arm64
            firmware_package: qemu-efi-aarch64
            qemu_package: qemu-system-arm
            macos_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @blame/agent-runtime build
      - run: pnpm test:semantic-harness-payload
      - run: node --test scripts/semantic-harness-install.test.mjs

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.qemu_package }} ${{ matrix.firmware_package }} ipxe-qemu qemu-utils

      - name: Configure QEMU acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          if [ "${{ matrix.macos_arch }}" = "aarch64" ]; then
            echo "QEMU_SYSTEM_AARCH64=qemu-system-aarch64 -machine virt -cpu max" >> "$GITHUB_ENV"
          fi

      - name: Build Lima image
        run: pnpm build:runtime:macos -- --arch ${{ matrix.macos_arch }}
        env:
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}

      - name: Stage macOS runtime in S3
        run: node scripts/runtime-artifact-transfer.mjs stage "$STAGING_SOURCE" macos "${{ matrix.macos_arch }}"
        env:
          STAGING_SOURCE: ${{ github.run_id }}/1

  deploy:
    name: Deploy runtime
    needs: [build-windows, build-macos]
    if: >-
      ${{
        always() &&
        inputs.deploy &&
        (
          inputs.artifact_run_id != '' || inputs.staging_source != '' ||
          (needs.build-windows.result == 'success' && needs.build-macos.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Restore runtime artifacts from S3
        if: inputs.artifact_run_id == ''
        run: node scripts/runtime-artifact-transfer.mjs restore "$STAGING_SOURCE"
        env:
          STAGING_SOURCE: ${{ inputs.staging_source || format('{0}/1', github.run_id) }}

      - name: Download Windows runtime artifacts
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: packages/desktop/dist/runtime/windows
          pattern: blame-runtime-windows-*
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Download macOS runtime artifacts
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: packages/desktop/dist/runtime/macos
          pattern: blame-runtime-macos-*
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Upload runtime artifacts to OVH Object Storage
        run: pnpm deploy:runtime
        env:
          BLAME_DOWNLOAD_BASE_URL: ${{ secrets.BLAME_DOWNLOAD_BASE_URL }}
          BLAME_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.BLAME_DOWNLOAD_S3_ACCESS_KEY_ID }}
          BLAME_DOWNLOAD_S3_BUCKET: ${{ vars.BLAME_DOWNLOAD_S3_BUCKET }}
          BLAME_DOWNLOAD_S3_ENDPOINT: ${{ vars.BLAME_DOWNLOAD_S3_ENDPOINT }}
          BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ vars.BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          BLAME_DOWNLOAD_S3_REGION: ${{ vars.BLAME_DOWNLOAD_S3_REGION }}
          BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          BLAME_DOWNLOAD_STORAGE_DRIVER: s3
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}

      - name: Delete transferred S3 artifacts
        if: success() && inputs.artifact_run_id == ''
        run: node scripts/runtime-artifact-transfer.mjs cleanup "$STAGING_SOURCE"
        env:
          STAGING_SOURCE: ${{ inputs.staging_source || format('{0}/1', github.run_id) }}

  cleanup:
    name: Delete transferred artifacts
    needs: deploy
    if: needs.deploy.result == 'success' && inputs.artifact_run_id != ''
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/artifact-cleanup.yml
    with:
      artifact_run_id: ${{ inputs.artifact_run_id || github.run_id }}
