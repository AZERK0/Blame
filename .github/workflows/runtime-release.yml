name: Runtime release

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime version
        required: true
        type: string
      deploy:
        default: true
        description: Upload runtime artifacts
        required: true
        type: boolean

jobs:
  build-windows:
    name: Build Windows runtime ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-latest
            windows_arch: amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            windows_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Build WSL rootfs
        run: pnpm build:runtime:windows -- --arch ${{ matrix.windows_arch }}
        env:
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}

      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: blame-runtime-windows-${{ matrix.name }}
          path: packages/desktop/dist/runtime/windows/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS runtime ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            firmware_package: ovmf
            qemu_package: qemu-system-x86
            macos_arch: x86_64
          - name: arm64
            firmware_package: qemu-efi-aarch64
            qemu_package: qemu-system-arm
            macos_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.qemu_package }} ${{ matrix.firmware_package }} qemu-utils

      - name: Configure QEMU acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          if [ "${{ matrix.macos_arch }}" = "aarch64" ]; then
            echo "QEMU_SYSTEM_AARCH64=qemu-system-aarch64 -machine virt -cpu max" >> "$GITHUB_ENV"
          fi

      - name: Build Lima image
        run: pnpm build:runtime:macos -- --arch ${{ matrix.macos_arch }}
        env:
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}

      - uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: blame-runtime-macos-${{ matrix.name }}
          path: packages/desktop/dist/runtime/macos/*.qcow2
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy runtime
    needs: [build-windows, build-macos]
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages/desktop/dist/runtime
          pattern: blame-runtime-*

      - name: Upload runtime artifacts to OVH Object Storage
        run: pnpm deploy:runtime
        env:
          BLAME_DOWNLOAD_BASE_URL: ${{ secrets.BLAME_DOWNLOAD_BASE_URL }}
          BLAME_DOWNLOAD_S3_ACCESS_KEY_ID: ${{ secrets.BLAME_DOWNLOAD_S3_ACCESS_KEY_ID }}
          BLAME_DOWNLOAD_S3_BUCKET: ${{ vars.BLAME_DOWNLOAD_S3_BUCKET }}
          BLAME_DOWNLOAD_S3_ENDPOINT: ${{ vars.BLAME_DOWNLOAD_S3_ENDPOINT }}
          BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE: ${{ vars.BLAME_DOWNLOAD_S3_FORCE_PATH_STYLE }}
          BLAME_DOWNLOAD_S3_REGION: ${{ vars.BLAME_DOWNLOAD_S3_REGION }}
          BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAME_DOWNLOAD_S3_SECRET_ACCESS_KEY }}
          BLAME_DOWNLOAD_STORAGE_DRIVER: s3
          BLAME_RUNTIME_VERSION: ${{ inputs.runtime_version }}
