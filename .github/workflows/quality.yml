name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  line-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-line-budgets.mjs

  preview-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @blame/preview-contract test
      - run: pnpm --filter @blame/preview-runtime test
      - run: pnpm --filter @blame/sandbox-runner test
      - run: pnpm --filter @blame/preview-edge test
      - run: pnpm --filter @blame/app test
      - run: pnpm --filter @blame/desktop test
      - run: pnpm --filter @blame/desktop test:performance
      - run: pnpm --filter @blame/desktop build
      - run: pnpm test:semantic-harness-payload
      - run: node --test scripts/semantic-harness-install.test.mjs
      - run: node --test scripts/release-preflight.test.mjs scripts/runtime-artifact-transfer.test.mjs scripts/macos-signing.test.mjs
      - run: pnpm --filter @blame/api build
      - run: pnpm --filter @blame/api exec node ace.js test --files='tests/unit/preview_runtime_security.spec.ts'
