      - blame.log.message_lengths
      - blame.log.source_id
      - blame.process.exit_code
      - blame.process.reason
      - blame.provider.auth_type
      - blame.execution.kind
      - blame.execution.recovered
      - blame.execution.status
      - blame.repository.language
      - blame.repository.size_bucket
      - blame.task.complexity_bucket
      - blame.multi_agent.enabled
      - blame.multi_agent.used
      - blame.workspace.step.name
      - blame.workspace.step.category
      - process.exit.code
      - blame.test.framework
      - blame.test.status
      - blame.preview.status
    redact_all_types: true
    blocked_key_patterns: &blocked_key_patterns
      - "(?i).*authorization.*"
      - "(?i).*api[._-]?key.*"
      - "(?i).*access[._-]?token.*"
      - "(?i).*refresh[._-]?token.*"
      - "(?i).*password.*"
      - "(?i).*secret.*"
      - "(?i).*credential.*"
      - "(?i).*cookie.*"
      - "(?i).*prompt.*"
      - "(?i).*file[._-]?content.*"
      - "(?i).*tool.*arguments.*"
      - "(?i).*tool.*result.*"
      - "(?i)(?:^|.*[._-])request[._-]?body$"
      - "(?i)(?:^|.*[._-])response[._-]?body$"
    blocked_values: &blocked_values
      - '(?i)\bBearer\s+[A-Za-z0-9._~+/=-]+'
      - '\bsk-[A-Za-z0-9_-]{12,}\b'
      - '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{20,}\b'
      - '\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'
      - '(?i)\b(?:api[_-]?key|access[_-]?token|authorization|password|refresh[_-]?token|secret|token)\s*[=:]\s*[^\s,;]+'
      - '(?i)[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'
    summary: silent
    url_sanitizer: &url_sanitizer
      enabled: true
      attributes:
        - http.url
        - url.full
      sanitize_span_name: true
    db_sanitizer: &db_sanitizer
      sanitize_span_name: true
      sql:
        enabled: true
        attributes:
          - db.statement
          - db.query.text
      redis:
        enabled: true
        attributes:
          - db.statement
          - db.operation.name
      memcached:
        enabled: true
        attributes:
          - db.statement
          - db.operation.name
      mongo:
        enabled: true
        attributes:
          - db.statement
          - db.query.text
      opensearch:
        enabled: true
        attributes:
          - db.statement
          - db.query.text
      es:
        enabled: true
        attributes:
          - db.statement
          - db.query.text

  redaction/logs:
    allow_all_keys: false
    allowed_keys: *detailed_allowed_keys
    redact_all_types: true
    blocked_key_patterns: *blocked_key_patterns
    blocked_values: *blocked_values
    summary: silent
    url_sanitizer: *url_sanitizer
    db_sanitizer: *db_sanitizer

  redaction/metrics:
    allow_all_keys: false
    allowed_keys:
