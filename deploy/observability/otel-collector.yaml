      - 'delete_key(span.attributes, "net.peer.port")'
      - 'set(span.attributes["gen_ai.provider.name"], span.attributes["gen_ai.system"]) where span.attributes["gen_ai.provider.name"] == nil and span.attributes["gen_ai.system"] != nil'
      - 'delete_key(span.attributes, "gen_ai.system")'
      - 'set(span.attributes["gen_ai.request.model"], span.attributes["model.name"]) where span.attributes["gen_ai.request.model"] == nil and span.attributes["model.name"] != nil'
      - 'delete_key(span.attributes, "model.name")'
      - 'set(span.attributes["gen_ai.provider.name"], span.attributes["provider.name"]) where span.attributes["gen_ai.provider.name"] == nil and span.attributes["provider.name"] != nil'
