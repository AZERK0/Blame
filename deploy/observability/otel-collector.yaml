      - 'span.attributes["http.route"] == "/healthz"'
      - 'span.attributes["http.route"] == "/ready"'
      - 'span.attributes["http.route"] == "/readyz"'

  filter/logs:
    error_mode: ignore
    log_conditions:
      - 'log.event_name == nil or not IsMatch(log.event_name, "^blame\\.[A-Za-z0-9_.-]+$")'
      - 'log.attributes["http.route"] == "/health"'
      - 'log.attributes["http.route"] == "/healthz"'
      - 'log.attributes["http.route"] == "/ready"'
      - 'log.attributes["http.route"] == "/readyz"'

  tail_sampling:
    sampling_strategy: trace-complete
    decision_wait: ${env:BLAME_OTEL_TAIL_DECISION_WAIT}
    decision_wait_after_root_received: ${env:BLAME_OTEL_TAIL_ROOT_GRACE_PERIOD}
    num_traces: ${env:BLAME_OTEL_TAIL_NUM_TRACES}
    expected_new_traces_per_sec: ${env:BLAME_OTEL_EXPECTED_NEW_TRACES_PER_SEC}
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes:
            - ERROR
      - name: semantic-errors
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'span.attributes["error.type"] != nil'
            - 'span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] >= 500'
            - 'span.attributes["blame.execution.status"] == "failed" or span.attributes["blame.execution.status"] == "failure"'
      - name: slow
        type: latency
        latency:
          threshold_ms: ${env:BLAME_OTEL_SLOW_TRACE_THRESHOLD_MS}
      - name: rollout
        type: and
        and:
          and_sub_policy:
            - name: rollout-version
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and resource.attributes["service.version"] == "${env:BLAME_OTEL_ROLLOUT_VERSION}"'
            - name: rollout-probability
              type: probabilistic
              probabilistic:
                hash_salt: blame-rollout
                sampling_percentage: ${env:BLAME_OTEL_ROLLOUT_SAMPLING_PERCENTAGE}
      - name: normal
        type: and
        and:
          and_sub_policy:
            - name: non-rollout-version
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and resource.attributes["service.version"] != "${env:BLAME_OTEL_ROLLOUT_VERSION}"'
            - name: normal-probability
              type: probabilistic
              probabilistic:
                hash_salt: blame-normal
                sampling_percentage: ${env:BLAME_OTEL_NORMAL_SAMPLING_PERCENTAGE}

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  otlp_grpc/backend:
    endpoint: ${env:BLAME_OTEL_BACKEND_ENDPOINT}
    headers:
      authorization: ${env:BLAME_OTEL_BACKEND_AUTHORIZATION}
    compression: gzip
    timeout: 10s
    tls:
      insecure: ${env:BLAME_OTEL_BACKEND_INSECURE}
      insecure_skip_verify: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 10
      queue_size: 5000

service:
  extensions:
    - file_storage
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - redaction/traces
        - transform/traces
        - attributes/detailed_safety
        - filter/traces
        - tail_sampling
        - batch
      exporters:
        - otlp_grpc/backend
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/metrics_cardinality
        - redaction/metrics
        - transform/metrics
        - attributes/metrics_safety
        - batch
      exporters:
        - otlp_grpc/backend
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - redaction/logs
        - transform/logs
        - attributes/detailed_safety
        - filter/logs
        - batch
      exporters:
        - otlp_grpc/backend
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
    logs:
      level: info
      encoding: json
      output_paths:
        - stdout
      error_output_paths:
        - stderr
