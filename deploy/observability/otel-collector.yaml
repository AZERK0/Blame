extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
    timeout: 10s
    fsync: true
    compaction:
      on_start: true
      directory: /var/lib/otelcol/compaction
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:BLAME_OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:BLAME_OTEL_MEMORY_SPIKE_LIMIT_MIB}

  filter/metrics_cardinality:
    error_mode: ignore
    metric_conditions:
      - 'datapoint.attributes["blame.story.id"] != nil'
      - 'datapoint.attributes["blame.execution.id"] != nil'
      - 'datapoint.attributes["blame.worktree.id"] != nil'
      - 'datapoint.attributes["blame.agent.id"] != nil'
      - 'datapoint.attributes["blame.agent.parent_id"] != nil'
      - 'datapoint.attributes["gen_ai.conversation.id"] != nil'
      - 'datapoint.attributes["session.id"] != nil'
      - 'datapoint.attributes["thread.id"] != nil'
      - 'datapoint.attributes["user.id"] != nil'
      - 'datapoint.attributes["enduser.id"] != nil'
      - 'datapoint.attributes["repository.url"] != nil'
      - 'datapoint.attributes["file.path"] != nil'
      - 'datapoint.attributes["code.file.path"] != nil'
      - 'datapoint.attributes["prompt"] != nil'
      - 'datapoint.attributes["prompt_hash"] != nil'
      - 'datapoint.attributes["error.message"] != nil'
      - 'datapoint.attributes["exception.message"] != nil'
      - 'datapoint.attributes["gen_ai.prompt"] != nil'
      - 'datapoint.attributes["gen_ai.input.messages"] != nil'
      - 'datapoint.attributes["gen_ai.output.messages"] != nil'
      - 'datapoint.attributes["gen_ai.tool.call.arguments"] != nil'
      - 'datapoint.attributes["gen_ai.tool.call.result"] != nil'
      - 'resource.attributes["blame.story.id"] != nil'
      - 'resource.attributes["blame.execution.id"] != nil'
      - 'resource.attributes["blame.worktree.id"] != nil'
      - 'resource.attributes["blame.agent.id"] != nil'
      - 'resource.attributes["blame.agent.parent_id"] != nil'
      - 'resource.attributes["gen_ai.conversation.id"] != nil'
      - 'resource.attributes["session.id"] != nil'
      - 'resource.attributes["thread.id"] != nil'
      - 'resource.attributes["user.id"] != nil'
      - 'resource.attributes["enduser.id"] != nil'
      - 'resource.attributes["repository.url"] != nil'
      - 'resource.attributes["file.path"] != nil'
      - 'resource.attributes["code.file.path"] != nil'
      - 'resource.attributes["prompt"] != nil'
      - 'resource.attributes["prompt_hash"] != nil'
      - 'resource.attributes["error.message"] != nil'
      - 'resource.attributes["exception.message"] != nil'

  redaction/traces:
    allow_all_keys: false
    allowed_keys: &detailed_allowed_keys
      - service.name
      - service.namespace
      - service.version
      - service.instance.id
      - deployment.environment
      - deployment.environment.name
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
      - cloud.provider
      - cloud.platform
      - cloud.region
      - cloud.availability_zone
      - container.image.name
