server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options "nosniff";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(?:latest/?)?$ {
    add_header Cache-Control "no-store";
    return 302 ${BLAME_DOWNLOAD_LANDING_URL};
  }

  location / {
    add_header Cache-Control "public, max-age=300";
    return 302 ${BLAME_DOWNLOAD_REDIRECT_BASE_URL}$request_uri;
  }
}
