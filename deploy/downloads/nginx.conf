server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options "nosniff";

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ ^/(?:latest/?)?$ {
    add_header Cache-Control "no-store";
    return 302 ${BLAME_DOWNLOAD_LANDING_URL};
  }

  # Installers and update metadata of the latest published desktop release.
  location ~ ^/latest/(?<file>[^/]+)$ {
    add_header Cache-Control "public, max-age=300";
    return 302 ${BLAME_RELEASES_URL}/latest/download/$file;
  }

  # Runtimes v1 to v9 predate GitHub Releases and stay in object storage.
  location ~ ^/runtime/v[1-9]/ {
    add_header Cache-Control "public, max-age=86400";
    return 302 ${BLAME_LEGACY_DOWNLOAD_BASE_URL}$request_uri;
  }

  location ~ ^/runtime/v(?<runtime>[0-9]+)/(?:(?:windows|macos)/)?(?<file>[^/]+)$ {
    add_header Cache-Control "public, max-age=86400";
    return 302 ${BLAME_RELEASES_URL}/download/runtime-v$runtime/$file;
  }

  location / {
    return 404;
  }
}
